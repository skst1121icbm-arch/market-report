name: Daily Market AI

on:
  schedule:
    - cron: '0 23 * * *'  # JST 8:00
  workflow_dispatch:

jobs:
  run-market-ai:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: |
          pip install -r requirements.txt

      - name: Market AI実行
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python main.py

      - name: CSVをGitに追加
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add market_ai_daily_log.csv || echo "no daily log"
          git add market_ai_event_log.csv || echo "no event log"

          git diff --cached --quiet || git commit -m "Update CSV logs $(date +'%Y-%m-%d %H:%M')"

      - name: push
        run: |
          git push
