name: Daily Market AI (FRED)

on:
  schedule:
    # JST 07:03（= UTC 22:03）
  - cron: '03 22 * * *'   # 07:03
  workflow_dispatch:

jobs:
  run-market-ai:
    runs-on: ubuntu-latest

    # ✅ Node24強制（警告回避 & 将来互換）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      # =========================
      # ① リポジトリ取得
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v6

      # =========================
      # ② Python セットアップ
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # =========================
      # ③ ライブラリインストール
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # ④ Market AI 実行
      # =========================
      - name: Run Market AI
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          echo "----- START MARKET AI -----"
          python main.py
          echo "----- END MARKET AI -----"

      # =========================
      # ⑤ HTMLログ保存（確認用）
      # =========================
      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-ai-html
          path: market_ai_latest_report.html

      # =========================
      # ⑥ CSVログコミット
      # =========================
      - name: Commit CSV logs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add market_ai_daily_log.csv || echo "no daily log"
          git add market_ai_event_log.csv || echo "no event log"

          git diff --cached --quiet || git commit -m "Update CSV logs $(date +'%Y-%m-%d %H:%M')"

      # =========================
      # ⑦ push（失敗しても止めない）
      # =========================
      - name: Push changes
        run: |
          git push || echo "push skipped"
